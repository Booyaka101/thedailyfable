<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>a small universe</title>
<meta property="og:title" content="a small universe">
<meta property="og:description" content="A particle-life universe grown from seed 42, with a generative ambient soundtrack. Watch epochs rise and fall, or perturb it yourself.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://booyaka101.github.io/thedailyfable/day01/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.6 "Cascadia Code", Consolas, monospace;
    color: #8a93a6; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px #000;
  }
  #hud b { color: #d6dbe6; font-weight: 600; }
  #hint {
    position: fixed; right: 14px; bottom: 12px;
    font: 11px/1.6 "Cascadia Code", Consolas, monospace;
    color: #4a5264; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">click&nbsp;=&nbsp;new universe &nbsp;·&nbsp; M&nbsp;=&nbsp;mutate physics &nbsp;·&nbsp; space&nbsp;=&nbsp;pause</div>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------- universe parameters ----------
const N_SPECIES = 6;
// The film put 1400 particles in 1280x720. Holding that COUNT on a desktop screen gave a
// third of the film's density — which is why the page read as "just dots moving around"
// while the film grew colonies. Scale the count to the viewport instead.
const DENSITY = 1400 / (1280 * 720);
let N_PARTICLES = 1400;                       // recomputed per big bang

// The exact rule matrix behind the film (numpy default_rng(42)). Used for the FIRST
// universe so a visitor sees the one from the video; click rerolls a random one.
const FILM_RULES = [
  [0.5479, -0.1222, 0.7172, 0.3947, -0.8116, 0.9512],
  [0.5223, 0.5721, -0.7438, -0.0992, -0.2584, 0.8535],
  [0.2877, 0.6455, -0.1132, -0.5455, 0.1092, -0.8724],
  [0.6553, 0.2633, 0.5162, -0.2909, 0.9414, 0.7862],
  [0.5568, -0.6107, -0.0666, -0.9124, -0.6914, 0.3661],
  [0.4895, 0.9350, -0.3483, -0.2591, -0.0609, -0.6211],
];
let firstUniverse = true;
// These MUST match day01/universe.py, which rendered the film. They did not, and the
// page looked like drifting dots while the film grew worms and ciliated cells: force was
// 220 vs 700 and there was one sim step per frame instead of two, so the effective force
// per frame was 6.4x too weak for any structure to form.
const RMAX = 70;          // interaction radius, px
const BETA = 0.28;        // inner repulsion zone (fraction of RMAX)
const FORCE = 700;        // force scale
const HALF_LIFE = 0.04;   // velocity half-life, seconds
const DT = 1 / 60;
const SUBSTEPS = 2;       // the film advances the sim twice per frame
const FADE = 0.94;        // per-frame trail decay (film value)
const MUTATE_EVERY = 15;  // seconds between physics mutations — the film's epochs
const MAX_EPOCHS = 12;    // then the physics hold: see the note in loop()

const PALETTE = ["#ff5d6c", "#ffb84d", "#f5e663", "#5dd39e", "#4fb3ff", "#b98cff"];

// two-syllable universe names, because every universe deserves one
const SYL_A = ["ka","ve","or","lu","tha","mi","zo","ae","ru","syl","on","pha"];
const SYL_B = ["ris","dun","mha","lek","via","tor","na","xis","hel","um","ara","ost"];
const nameOf = () => {
  const pick = a => a[(Math.random() * a.length) | 0];
  return pick(SYL_A) + pick(SYL_B) + "-" + ((Math.random() * 900 + 100) | 0);
};

let rules;        // rules[i][j] in [-1, 1]: how species i feels about species j
let px, py, vx, vy, sp;   // particle state (typed arrays)
let universeName, epoch, paused, elapsed, lastMutate;

function randomRules() {
  const m = [];
  for (let i = 0; i < N_SPECIES; i++) {
    m.push([]);
    for (let j = 0; j < N_SPECIES; j++) m[i].push(Math.random() * 2 - 1);
  }
  return m;
}

function bigBang() {
  // first load = the film's universe; every click after that is a fresh roll of the dice
  rules = firstUniverse ? FILM_RULES.map(r => r.slice()) : randomRules();
  // hold the film's density whatever the screen size (capped so a 4K display stays smooth)
  N_PARTICLES = Math.max(600, Math.min(4200, Math.round(W * H * DENSITY)));
  px = new Float32Array(N_PARTICLES);
  py = new Float32Array(N_PARTICLES);
  vx = new Float32Array(N_PARTICLES);
  vy = new Float32Array(N_PARTICLES);
  sp = new Uint8Array(N_PARTICLES);
  for (let i = 0; i < N_PARTICLES; i++) {
    px[i] = Math.random() * W;
    py[i] = Math.random() * H;
    sp[i] = (Math.random() * N_SPECIES) | 0;
  }
  universeName = firstUniverse ? "onara-390" : nameOf();   // the film's universe by name
  firstUniverse = false;
  epoch = 1;
  elapsed = 0;
  lastMutate = 0;
  paused = false;
  ctx.fillStyle = "#05060a";
  ctx.fillRect(0, 0, W, H);
}

// nudge a handful of relationships — the universe drifts, life adapts or dies
function mutate() {
  const nudges = 4 + ((Math.random() * 5) | 0);
  for (let k = 0; k < nudges; k++) {
    const i = (Math.random() * N_SPECIES) | 0;
    const j = (Math.random() * N_SPECIES) | 0;
    rules[i][j] = Math.max(-1, Math.min(1, rules[i][j] + (Math.random() * 1.2 - 0.6)));
  }
  epoch++;
}

// classic particle-life force profile: hard repulsion up close,
// species-dependent attraction/repulsion in the outer band
function force(r, a) {
  if (r < BETA) return r / BETA - 1;
  if (r < 1) return a * (1 - Math.abs(2 * r - 1 - BETA) / (1 - BETA));
  return 0;
}

// spatial hash grid so 1400 particles stays cheap
let cols, rows, grid, gridCount;
function rebuildGrid() {
  cols = Math.max(1, Math.ceil(W / RMAX));
  rows = Math.max(1, Math.ceil(H / RMAX));
  // stronger forces mean denser clusters; 64 silently DROPPED interactions in a crowded
  // cell, which suppressed exactly the structures we want
  const cap = 256;
  grid = new Int32Array(cols * rows * cap);
  gridCount = new Int32Array(cols * rows);
  grid.cap = cap;
}
rebuildGrid();
window.addEventListener("resize", rebuildGrid);

function step() {
  gridCount.fill(0);
  const cap = grid.cap;
  for (let i = 0; i < N_PARTICLES; i++) {
    const cx = Math.min(cols - 1, (px[i] / RMAX) | 0);
    const cy = Math.min(rows - 1, (py[i] / RMAX) | 0);
    const cell = cy * cols + cx;
    if (gridCount[cell] < cap) grid[cell * cap + gridCount[cell]++] = i;
  }

  const friction = Math.pow(0.5, DT / HALF_LIFE);

  for (let i = 0; i < N_PARTICLES; i++) {
    let fx = 0, fy = 0;
    const xi = px[i], yi = py[i], si = sp[i];
    const cx = Math.min(cols - 1, (xi / RMAX) | 0);
    const cy = Math.min(rows - 1, (yi / RMAX) | 0);

    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        const gx = (cx + ox + cols) % cols;
        const gy = (cy + oy + rows) % rows;
        const cell = gy * cols + gx;
        const n = gridCount[cell];
        for (let k = 0; k < n; k++) {
          const j = grid[cell * cap + k];
          if (j === i) continue;
          // torus world: interact across the wrap seam too
          let dx = px[j] - xi;
          let dy = py[j] - yi;
          if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
          if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
          const d2 = dx * dx + dy * dy;
          if (d2 === 0 || d2 > RMAX * RMAX) continue;
          const d = Math.sqrt(d2);
          const f = force(d / RMAX, rules[si][sp[j]]);
          fx += (dx / d) * f;
          fy += (dy / d) * f;
        }
      }
    }

    vx[i] = vx[i] * friction + fx * FORCE * DT;
    vy[i] = vy[i] * friction + fy * FORCE * DT;
  }

  for (let i = 0; i < N_PARTICLES; i++) {
    px[i] = (px[i] + vx[i] * DT + W) % W;
    py[i] = (py[i] + vy[i] * DT + H) % H;
  }
}

// The film stamps a gaussian per particle into a float buffer, decays it by FADE and
// tonemaps. Flat 1.6px dots could never look like that, so: one pre-rendered radial
// sprite per species, drawn additively ("lighter"), over a slow fade. Dense clusters
// saturate toward white, which is what the film's tonemap does at the core.
// Sprite kept tight and dim: the film's gaussian has sigma 1.7, so most energy sits within
// ~3px, and a single particle must stay its own COLOUR. A bright broad sprite saturated
// additively to white and smeared the whole field grey.
const SPRITE_R = 5;
const sprites = PALETTE.map(hex => {
  const c = document.createElement("canvas");
  c.width = c.height = SPRITE_R * 2;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(SPRITE_R, SPRITE_R, 0, SPRITE_R, SPRITE_R, SPRITE_R);
  const r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  grad.addColorStop(0.00, `rgba(${r},${gg},${b},0.55)`);
  grad.addColorStop(0.40, `rgba(${r},${gg},${b},0.18)`);
  grad.addColorStop(1.00, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, SPRITE_R * 2, SPRITE_R * 2);
  return c;
});

function draw() {
  // decay toward BLACK, not toward the background colour: fading to #05060a left a blue
  // haze building up across the whole field, because additive draws never subtract it
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgba(0, 0, 0, ${1 - FADE})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < N_PARTICLES; i++) {
    ctx.drawImage(sprites[sp[i]], px[i] - SPRITE_R, py[i] - SPRITE_R);
  }
  ctx.globalCompositeOperation = "source-over";
}

function loop() {
  if (!paused) {
    for (let s = 0; s < SUBSTEPS; s++) step();   // the film's 2 steps per frame
    draw();
    elapsed += DT;
    // The film only lived 75 seconds (5 epochs). A page left open does not: after ~350
    // minutes of 15s epochs the rule matrix has random-walked ~0.78 away from where it
    // started with a quarter of its rules pinned at the +-1 extremes — degenerate physics
    // where nothing can organise, which is exactly the "just dots moving around" report.
    // So the universe stops mutating once it has had its epochs, and then simply lives.
    if (epoch < MAX_EPOCHS && elapsed - lastMutate > MUTATE_EVERY) {
      lastMutate = elapsed;
      mutate();
    }
  }
  const mm = String((elapsed / 60) | 0).padStart(2, "0");
  const ss = String((elapsed % 60) | 0).padStart(2, "0");
  const settled = epoch >= MAX_EPOCHS ? " · <b>settled</b>" : "";
  hud.innerHTML = `universe <b>${universeName}</b> · epoch <b>${epoch}</b> · age <b>${mm}:${ss}</b>${settled}${paused ? " · <b>paused</b>" : ""}`;
  requestAnimationFrame(loop);
}

canvas.addEventListener("click", bigBang);
window.addEventListener("keydown", e => {
  if (e.code === "Space") { paused = !paused; e.preventDefault(); }
  if (e.key === "m" || e.key === "M") mutate();
});

bigBang();
loop();
</script>
</body>
</html>
