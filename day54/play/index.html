<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>What the mould would have built</title>
<style>
  html, body { margin:0; height:100%; background:#050810; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:#8a919c; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; left:0; top:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { pointer-events:auto; }
  #title { position:fixed; left:14px; top:12px; pointer-events:none; }
  #title h1 { margin:0; font-size:12px; font-weight:600; letter-spacing:0.14em; color:#b9c0ca; }
  #title p { margin:3px 0 0; font-size:11px; color:#6f7783; }
  #readout { position:fixed; right:14px; top:12px; font-size:11px; color:#6f7783; text-align:right; pointer-events:none; font-variant-numeric:tabular-nums; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 8px; background:linear-gradient(to top, rgba(5,8,16,0.9), rgba(5,8,16,0)); }
  #bar button { font:12px system-ui, sans-serif; color:#c3c9d2; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); border-radius:4px; padding:6px 11px; cursor:pointer; touch-action:manipulation; }
  #bar button:active { background:rgba(255,255,255,0.14); }
  #bar button.on { border-color:rgba(115,179,255,0.7); color:#a9cdff; }
  #hint { flex-basis:100%; text-align:center; font-size:11px; color:#6f7783; }
  @media (max-width: 699px) { #readout { right:auto; left:14px; top:46px; text-align:left; } }
  #nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; font-size:14px; line-height:1.5; color:#b9c0ca; text-align:center; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="title"><h1>WHAT THE MOULD WOULD HAVE BUILT</h1><p>a slime mould on the map of the Netherlands, cities as food</p></div>
<div id="readout"></div>
<div id="bar">
  <button id="reset">Reset</button>
  <button id="rail">Real rail: off</button>
  <button id="pause">Pause</button>
  <div id="hint">tap the map to add a city, tap a city to remove it</div>
</div>
<div id="nogl"></div>

<script>
'use strict';
const W = 800, H = 928;
const PHONE = window.innerWidth < 700 || matchMedia('(pointer: coarse)').matches;
const Q = new URLSearchParams(location.search);
const LOG2N = +(Q.get('n') || (PHONE ? 16 : 18));
const AW = 1 << Math.ceil(LOG2N / 2), AH = 1 << Math.floor(LOG2N / 2), N = AW * AH;
const STEPS_PER_FRAME = +(Q.get('spf') || (PHONE ? 1 : 2));
const P = { so: 6.0, sa: 30, ra: 40, decay: 0.08, foodGain: 3.0, deposit: +(Q.get('dep') || 1.0), toneScale: +(Q.get('tone') || 3.0) };

const glCanvas = document.getElementById('gl');
const uiCanvas = document.getElementById('ui');
const ui = uiCanvas.getContext('2d');
const readout = document.getElementById('readout');

function fail(msg) {
  const d = document.getElementById('nogl');
  d.textContent = msg; d.style.display = 'flex';
  document.getElementById('bar').style.display = 'none';
  throw new Error(msg);
}

const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
if (!gl) fail('This page needs WebGL2, which your browser does not offer.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('This page needs float render targets (EXT_color_buffer_float), which your browser or GPU does not offer.');

// ---------- shaders ----------
const VS_QUAD = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

const FS_AGENT = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D u_agents, u_trail, u_world, u_body, u_cities;
uniform uint u_frame; uniform vec2 u_size; uniform float u_so, u_sa, u_ra, u_crowd, u_cityTotal; uniform int u_ncity;
out vec4 o;
uint hash(uint x){ x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return x; }
float rnd(uint id, uint salt){ return float(hash(id ^ hash(salt * 0x9e3779b9u + 0x85ebca6bu))) / 4294967296.0; }
float sense(vec2 q){ ivec2 ip = clamp(ivec2(floor(q)), ivec2(0), ivec2(u_size) - 1); return texelFetch(u_trail, ip, 0).r; }
bool onLand(vec2 q){ return q.x >= 0.0 && q.y >= 0.0 && q.x < u_size.x && q.y < u_size.y && texelFetch(u_world, ivec2(floor(q)), 0).r >= 0.5; }
// crowded agents die and are reborn at a city, weighted by food strength (the sim.py rule that keeps veins thin)
bool rebirth(uint id, uint s, inout vec2 p, inout float ang){
  if (u_ncity == 0 || texelFetch(u_body, ivec2(floor(p)), 0).r <= u_crowd || rnd(id, s) >= 0.5) return false;
  float u = rnd(id, s + 1u) * u_cityTotal;
  int lo = 0, hi = u_ncity - 1;
  for (int i = 0; i < 10; i++) { int mid = (lo + hi) / 2; if (texelFetch(u_cities, ivec2(mid, 0), 0).z < u) lo = min(mid + 1, hi); else hi = mid; }
  vec2 c = texelFetch(u_cities, ivec2(lo, 0), 0).xy;
  ang = rnd(id, s + 2u) * 6.2831853;
  vec2 q = c + rnd(id, s + 3u) * 2.0 * vec2(cos(ang), sin(ang));
  p = onLand(q) ? q : c;
  return true;
}
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  uint id = uint(ip.y) * ${AW}u + uint(ip.x);
  vec4 a = texelFetch(u_agents, ip, 0);
  vec2 p = a.xy; float ang = a.z; uint s = u_frame * 8u;
  if (rebirth(id, s + 2u, p, ang)) { o = vec4(p, ang, 0.0); return; }
  float c = sense(p + u_so * vec2(cos(ang), sin(ang)));
  float l = sense(p + u_so * vec2(cos(ang + u_sa), sin(ang + u_sa)));
  float r = sense(p + u_so * vec2(cos(ang - u_sa), sin(ang - u_sa)));
  if (c >= l && c >= r) { }
  else if (l > c && r > c) { ang += (rnd(id, s) < 0.5) ? u_ra : -u_ra; }
  else if (l > r) { ang += u_ra; }
  else { ang -= u_ra; }
  vec2 np = p + vec2(cos(ang), sin(ang));
  if (!onLand(np)) { np = p; ang = rnd(id, s + 1u) * 6.2831853; }
  o = vec4(np, ang, 0.0);
}`;

const VS_DEPOSIT = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D u_agents; uniform vec2 u_size;
void main(){
  ivec2 ip = ivec2(gl_VertexID % ${AW}, gl_VertexID / ${AW});
  vec2 p = texelFetch(u_agents, ip, 0).xy;
  gl_Position = vec4((floor(p) + 0.5) / u_size * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;
const FS_DEPOSIT = `#version 300 es
precision highp float; uniform float u_dep; out vec4 o; void main(){ o = vec4(u_dep, 0.0, 0.0, 1.0); }`;

const FS_FIELD = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D u_trail, u_body, u_dep, u_food, u_world; uniform float u_decay;
layout(location=0) out vec4 o_trail; layout(location=1) out vec4 o_body;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy); ivec2 mx = textureSize(u_trail, 0) - 1;
  float st = 0.0, sb = 0.0;
  for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
    ivec2 q = clamp(ip + ivec2(dx, dy), ivec2(0), mx);
    float d = texelFetch(u_dep, q, 0).r;
    st += texelFetch(u_trail, q, 0).r + d + texelFetch(u_food, q, 0).r;
    sb += texelFetch(u_body, q, 0).r * 0.9 + d;
  }
  float land = step(0.5, texelFetch(u_world, ip, 0).r);
  o_trail = vec4(st / 9.0 * (1.0 - u_decay) * land);
  o_body = vec4(sb / 9.0);
}`;

const FS_DISPLAY = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D u_body, u_world; uniform vec4 u_rect; uniform float u_rail, u_scale;
out vec4 o;
void main(){
  vec2 q = (gl_FragCoord.xy - u_rect.xy) / u_rect.zw;
  vec3 water = vec3(0.02, 0.03, 0.05);
  if (q.x < 0.0 || q.y < 0.0 || q.x >= 1.0 || q.y >= 1.0) { o = vec4(water, 1.0); return; }
  vec2 uv = vec2(q.x, 1.0 - q.y);
  vec2 w = texture(u_world, uv).rg;
  float body = texture(u_body, uv).r;
  float t = pow(clamp(body / u_scale, 0.0, 1.0), 0.5) * w.r;
  vec3 col = mix(water, vec3(0.05, 0.06, 0.07), w.r);
  col = mix(col, vec3(1.0, 0.85, 0.45), t);
  col = mix(col, vec3(0.45, 0.7, 1.0), 0.8 * w.g * u_rail);
  o = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error: ' + gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error: ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const prAgent = program(VS_QUAD, FS_AGENT);
const prDeposit = program(VS_DEPOSIT, FS_DEPOSIT);
const prField = program(VS_QUAD, FS_FIELD);
const prDisplay = program(VS_QUAD, FS_DISPLAY);

// ---------- textures / fbos ----------
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
function tex(internal, w, h, format, type, data) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data || null);
  return t;
}
function fbo(attachments) {
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  attachments.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(attachments.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) fail('Framebuffer incomplete: 0x' + st.toString(16));
  return f;
}
const texAgents = [tex(gl.RGBA32F, AW, AH, gl.RGBA, gl.FLOAT), tex(gl.RGBA32F, AW, AH, gl.RGBA, gl.FLOAT)];
const texTrail = [tex(gl.R32F, W, H, gl.RED, gl.FLOAT), tex(gl.R32F, W, H, gl.RED, gl.FLOAT)];
const texBody = [tex(gl.R32F, W, H, gl.RED, gl.FLOAT), tex(gl.R32F, W, H, gl.RED, gl.FLOAT)];
const texDep = tex(gl.R16F, W, H, gl.RED, gl.HALF_FLOAT);   // R16F so additive blending works without EXT_float_blend
const texFood = tex(gl.R32F, W, H, gl.RED, gl.FLOAT);
const MAXC = 1024, texCities = tex(gl.RGBA32F, MAXC, 1, gl.RGBA, gl.FLOAT);
let cityTotal = 0;
let texWorld = null;
const fbAgents = [fbo([texAgents[0]]), fbo([texAgents[1]])];
const fbField = [fbo([texTrail[0], texBody[0]]), fbo([texTrail[1], texBody[1]])];
const fbDep = fbo([texDep]);
const smoothSampler = gl.createSampler();
gl.samplerParameteri(smoothSampler, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.samplerParameteri(smoothSampler, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.samplerParameteri(smoothSampler, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.samplerParameteri(smoothSampler, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

function bind(unit, t, sampler) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.bindSampler(unit, sampler || null); }

// ---------- state ----------
let world = null;          // Uint8ClampedArray RGBA of world.png
let landPixels = null;     // Uint32Array of land pixel indices
let cities = [], maxpop = 1;
let cur = 0, fcur = 0, frame = 0, paused = false, showRail = false;
let rect = { ox: 0, oy: 0, s: 1 }, dpr = 1;
let stepTimes = [], sps = 0, fps = 0, frameTimes = [];

function initAgents() {
  const d = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const idx = landPixels[(Math.random() * landPixels.length) | 0];
    d[i * 4] = (idx % W) + Math.random(); d[i * 4 + 1] = ((idx / W) | 0) + Math.random();
    d[i * 4 + 2] = Math.random() * Math.PI * 2;
  }
  for (const t of texAgents) { gl.bindTexture(gl.TEXTURE_2D, t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AW, AH, gl.RGBA, gl.FLOAT, d); }
  const zero = new Float32Array(W * H);
  for (const t of [...texTrail, ...texBody]) { gl.bindTexture(gl.TEXTURE_2D, t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED, gl.FLOAT, zero); }
  frame = 0;
}

function strength(c) { return Math.sqrt(c.pop / maxpop); }

function rebuildFood() {
  const f = new Float32Array(W * H);
  for (const c of cities) {
    const cx = Math.round(c.x), cy = Math.round(c.y), g = P.foodGain * strength(c);
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      if (dx * dx + dy * dy > 5) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || y < 0 || x >= W || y >= H || world[(y * W + x) * 4] < 128) continue;
      f[y * W + x] += g;
    }
  }
  gl.bindTexture(gl.TEXTURE_2D, texFood); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED, gl.FLOAT, f);
  // city list for rebirth: x, y, cumulative strength
  const cd = new Float32Array(MAXC * 4); cityTotal = 0;
  cities.slice(0, MAXC).forEach((c, i) => { cityTotal += strength(c); cd[i * 4] = c.x; cd[i * 4 + 1] = c.y; cd[i * 4 + 2] = cityTotal; });
  gl.bindTexture(gl.TEXTURE_2D, texCities); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, MAXC, 1, gl.RGBA, gl.FLOAT, cd);
  drawOverlay();
}

// ---------- sim ----------
function step() {
  const nxt = 1 - cur;
  gl.disable(gl.BLEND);
  // agents
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbAgents[nxt]); gl.viewport(0, 0, AW, AH);
  gl.useProgram(prAgent.p);
  bind(0, texAgents[cur]); bind(1, texTrail[fcur]); bind(2, texWorld); bind(3, texBody[fcur]); bind(4, texCities);
  gl.uniform1i(prAgent.u.u_agents, 0); gl.uniform1i(prAgent.u.u_trail, 1); gl.uniform1i(prAgent.u.u_world, 2);
  gl.uniform1i(prAgent.u.u_body, 3); gl.uniform1i(prAgent.u.u_cities, 4);
  gl.uniform1f(prAgent.u.u_crowd, P.crowd); gl.uniform1f(prAgent.u.u_cityTotal, cityTotal); gl.uniform1i(prAgent.u.u_ncity, cities.length);
  gl.uniform1ui(prAgent.u.u_frame, frame); gl.uniform2f(prAgent.u.u_size, W, H);
  gl.uniform1f(prAgent.u.u_so, P.so); gl.uniform1f(prAgent.u.u_sa, P.sa * Math.PI / 180); gl.uniform1f(prAgent.u.u_ra, P.ra * Math.PI / 180);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // deposit
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbDep); gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(prDeposit.p);
  bind(0, texAgents[nxt]);
  gl.uniform1i(prDeposit.u.u_agents, 0); gl.uniform2f(prDeposit.u.u_size, W, H); gl.uniform1f(prDeposit.u.u_dep, P.deposit);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);
  // trail + body
  const fn = 1 - fcur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbField[fn]); gl.viewport(0, 0, W, H);
  gl.useProgram(prField.p);
  bind(0, texTrail[fcur]); bind(1, texBody[fcur]); bind(2, texDep); bind(3, texFood); bind(4, texWorld);
  gl.uniform1i(prField.u.u_trail, 0); gl.uniform1i(prField.u.u_body, 1); gl.uniform1i(prField.u.u_dep, 2);
  gl.uniform1i(prField.u.u_food, 3); gl.uniform1i(prField.u.u_world, 4); gl.uniform1f(prField.u.u_decay, P.decay);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  cur = nxt; fcur = fn; frame++;
  stepTimes.push(performance.now());
}

function display() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.useProgram(prDisplay.p);
  bind(0, texBody[fcur]); bind(1, texWorld, smoothSampler);
  gl.uniform1i(prDisplay.u.u_body, 0); gl.uniform1i(prDisplay.u.u_world, 1);
  const k = glCanvas.width / innerWidth;
  gl.uniform4f(prDisplay.u.u_rect, rect.ox * k, glCanvas.height - (rect.oy + rect.s * H) * k, rect.s * W * k, rect.s * H * k);
  gl.uniform1f(prDisplay.u.u_rail, showRail ? 1 : 0); gl.uniform1f(prDisplay.u.u_scale, P.toneScale);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindSampler(1, null);
}

// ---------- overlay ----------
function drawOverlay() {
  const c = ui; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
  const labelled = new Set(cities.filter(x => x.name).sort((a, b) => b.pop - a.pop).slice(0, 10));
  c.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif'; c.textBaseline = 'middle';
  const placed = [];
  const free = b => placed.every(p => b.x1 < p.x0 || b.x0 > p.x1 || b.y1 < p.y0 || b.y0 > p.y1);
  for (const city of [...cities].sort((a, b) => b.pop - a.pop)) {
    const s = strength(city), x = rect.ox + city.x * rect.s, y = rect.oy + city.y * rect.s, r = (2 + 3 * s) * rect.s;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(190,150,110,0.55)'; c.lineWidth = 1; c.stroke();
    if (!labelled.has(city)) continue;
    const w = c.measureText(city.name).width;
    const spots = [[x + r + 3, y], [x - w / 2, y + r + 9], [x - w / 2, y - r - 9], [x - r - 3 - w, y]];
    for (const [lx, ly] of spots) {
      const b = { x0: lx - 2, x1: lx + w + 2, y0: ly - 7, y1: ly + 7 };
      if (!free(b)) continue;
      placed.push(b);
      c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillText(city.name, lx + 1, ly + 1);
      c.fillStyle = 'rgba(210,200,185,0.85)'; c.fillText(city.name, lx, ly);
      break;
    }
  }
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const gd = Math.min(dpr, 2);
  glCanvas.width = Math.round(innerWidth * gd); glCanvas.height = Math.round(innerHeight * gd);
  uiCanvas.width = Math.round(innerWidth * dpr); uiCanvas.height = Math.round(innerHeight * dpr);
  const top = innerWidth < 700 ? 66 : 44, bottom = innerWidth < 700 ? 76 : 56;
  const availH = innerHeight - top - bottom, availW = innerWidth - 16;
  const s = Math.min(availW / W, availH / H);
  rect = { s, ox: (innerWidth - W * s) / 2, oy: top + (availH - H * s) / 2 };
  drawOverlay();
}

// ---------- interaction ----------
function tap(clientX, clientY) {
  const mx = (clientX - rect.ox) / rect.s, my = (clientY - rect.oy) / rect.s;
  if (mx < 0 || my < 0 || mx >= W || my >= H) return;
  let best = null, bd = 12;
  for (const c of cities) { const d = Math.hypot(c.x - mx, c.y - my); if (d < bd) { bd = d; best = c; } }
  if (best) { cities.splice(cities.indexOf(best), 1); rebuildFood(); return; }
  if (world[((my | 0) * W + (mx | 0)) * 4] < 128) return;
  cities.push({ name: '', x: mx, y: my, pop: maxpop * 0.25, main: true, src: 'user' });
  rebuildFood();
}
uiCanvas.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX, e.clientY); });
for (const ev of ['touchstart', 'touchmove', 'touchend']) uiCanvas.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.getElementById('reset').onclick = () => { initAgents(); stepTimes = []; };
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; };
document.getElementById('rail').onclick = e => { showRail = !showRail; e.target.textContent = 'Real rail: ' + (showRail ? 'on' : 'off'); e.target.classList.toggle('on', showRail); };
addEventListener('resize', resize);

// ---------- loop ----------
let lastReadout = 0;
function loop(now) {
  if (!paused) for (let i = 0; i < STEPS_PER_FRAME; i++) step();
  display();
  frameTimes.push(now);
  while (stepTimes.length && stepTimes[0] < now - 1000) stepTimes.shift();
  while (frameTimes.length && frameTimes[0] < now - 1000) frameTimes.shift();
  if (now - lastReadout > 250) {
    sps = stepTimes.length; fps = frameTimes.length; lastReadout = now;
    readout.textContent = N.toLocaleString('en') + ' agents · ' + sps + ' steps/s · ' + fps + ' fps';
    window.__stats = { agents: N, sps, fps, frame, cities: cities.length };
    const err = gl.getError(); if (err) console.error('WebGL error 0x' + err.toString(16));
  }
  requestAnimationFrame(loop);
}

// ---------- boot ----------
async function boot() {
  const [img, cj] = await Promise.all([
    new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'world.png'; }),
    fetch('cities.json').then(r => r.json()),
  ]);
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const octx = oc.getContext('2d', { willReadFrequently: true }); octx.drawImage(img, 0, 0);
  world = octx.getImageData(0, 0, W, H).data;
  const lp = []; for (let i = 0; i < W * H; i++) if (world[i * 4] >= 128) lp.push(i);
  landPixels = Uint32Array.from(lp);
  // body ~ 10 * local agent density at steady state; the reference run was calibrated at 0.08 agents per land pixel
  const density = N / landPixels.length, over = Math.max(1, density / 0.08);
  P.crowd = +(Q.get('crowd') || 40 * density);
  if (!Q.get('tone')) P.toneScale = 6.0 * over;   // 2x the spec's body/3 so trunks read brighter than branches
  texWorld = tex(gl.RGBA8, W, H, gl.RGBA, gl.UNSIGNED_BYTE, world);
  cities = cj.cities.filter(c => c.main).map(c => ({ ...c }));
  maxpop = Math.max(...cities.map(c => c.pop));
  resize(); initAgents(); rebuildFood();
  const err = gl.getError(); if (err) console.error('WebGL error after init 0x' + err.toString(16));
  requestAnimationFrame(loop);
}
boot().catch(e => { console.error(e); fail('Could not start: ' + e.message); });
</script>
